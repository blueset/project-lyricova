# Type-check & lint gate for the monorepo.
#
# This workflow validates the codebase with BOTH the classic TypeScript
# compiler (`tsc`, pinned to 6.0.x) and the native TypeScript 7 compiler
# (`tsgo`, via @typescript/native-preview), plus ESLint. It intentionally does
# NOT run the full `next build` / `api build` (those require env/secrets such as
# PostHog sourcemap upload), and it skips the network-dependent provider
# integration tests.
#
# It is scoped to pull requests and manual runs so it can be adopted
# incrementally (the repository had no CI before this file was added).
#
# `packages/glyph-renderer` is a Rust/wasm-bindgen crate (built via
# `wasm-pack`) whose generated `pkg/` bindings are imported by its own `ts/`
# sources. Both jobs below therefore provision a real stable Rust toolchain
# via `dtolnay/rust-toolchain` (NOT the outdated Rust 1.63 available through
# `apt`, which is too old for this crate's dependencies) with the
# `wasm32-unknown-unknown` target, then explicitly build/test the package so
# its `pkg/` output exists before ESLint/tsc/tsgo type-check `ts/index.ts`
# and before any future consumer (e.g. `@lyricova/jukebox`) needs it.
name: Type-check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Lint & type-check (tsc + tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (for @lyricova/glyph-renderer wasm build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/glyph-renderer

      - name: Install dependencies
        run: npm install

      # Build the two zero-side-effect library packages first. @lyricova/components
      # runs GraphQL codegen in its build (producing src/gql/**), which the two
      # Next.js apps type-check against. lyrics-kit is a plain dual tsc build.
      # glyph-renderer's build runs `wasm-pack build` (producing `pkg/`) then
      # `tsc` - its `pkg/` output must exist before ESLint/tsc/tsgo type-check
      # `ts/index.ts`, which imports the generated bindings.
      - name: Build libraries (lyrics-kit, components + codegen, glyph-renderer wasm)
        run: |
          npm run build -w lyrics-kit
          npm run build -w @lyricova/components
          npm run build -w @lyricova/glyph-renderer

      - name: Validate glyph-renderer (cargo test)
        run: npm run test -w @lyricova/glyph-renderer

      # Run API and jukebox unit/integration suites here, where npm deps,
      # components codegen, lyrics-kit, and glyph-renderer's built WASM/pkg
      # artifacts already exist. This covers the API-owned font routes plus the
      # glyph layout/rendering modules without re-running Playwright or the
      # network-dependent provider coverage intentionally excluded here.
      - name: Run API and jukebox Vitest suites
        run: |
          npm run test -w @lyricova/api
          npm run test -w @lyricova/jukebox

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Type-check (tsc 6.x)
        run: npm run typecheck

      - name: Type-check (tsgo — TypeScript 7 native preview)
        run: npm run typecheck:native

  browser-tests:
    name: Lyrics animations (Chromium + Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (for @lyricova/glyph-renderer wasm build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/glyph-renderer

      - name: Install dependencies
        run: npm install

      # glyph-renderer is a jukebox dependency (imported for paragraph layout /
      # canvas rendering and served at /api/glyph-renderer/wasm), and the browser
      # fixture streams its built pkg/ wasm. Build + validate it before the
      # Playwright run so the fixture's WASM byte route has real artifacts.
      - name: Build & validate glyph-renderer (wasm-pack + cargo test)
        run: |
          npm run build -w @lyricova/glyph-renderer
          npm run test -w @lyricova/glyph-renderer

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run jukebox browser tests
        run: npm run test:browser -w @lyricova/jukebox
