[package]
name = "glyph-renderer"
version = "0.1.0"
edition = "2021"
description = "WASM text shaping/layout proof of concept for Project Lyricova, backed by rustybuzz"
license = "AGPL-3.0-or-later"
repository = "https://github.com/blueset/project-lyricova"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustybuzz = "0.20"
# Only here to turn on `gvar-alloc` for the `ttf-parser` that `rustybuzz`
# already pulls in (feature unification applies it to that shared copy; the
# crate is used via `rustybuzz::ttf_parser`, never imported directly).
# Without it `ttf-parser` keeps a glyph's `gvar` tuples in a fixed 32-slot
# stack buffer and silently outlines nothing for any glyph that needs more -
# e.g. `e` and `f` in Mona Sans VF, which have 35. See `outline.rs`.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
unicode-script = "0.5.8"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
